# hostapd config for the LDN bridge.
#
# Copy to /etc/hostapd/ldn-ap.conf and set `interface` and `channel`. That is
# the whole configuration.
#
# Measured working: Debian 13, kernel 6.12, RTL8812AU with the aircrack-ng
# v5.13.6 driver, on a physical interface (not a VIF), channel 1. The bridge
# transmitted LDN advertisements through nl80211 .mgmt_tx on this interface at
# ~100 ms intervals with no errors. See docs/HARDWARE_CHECKLIST.md.
#
# Design notes:
#
#   * The SSID is a throwaway. A real LDN network's SSID is 32 random hex
#     digits that are *zeroed in the beacons*; the consoles never look at the
#     beacon SSID, they scan for LDN action frames on the 2.4 GHz channels.
#   * `ignore_broadcast_ssid=1` keeps our SSID out of the beacons so we do not
#     look like an ordinary network.
#   * `auth_algs=1` is *open system authentication* - required, because LDN's
#     join sequence performs an 802.11 open-system auth first and only then
#     sends its own LDN authentication frame.
#   * `wpa=0`: no WPA. LDN's own encryption is AES-CTR above the MAC, using
#     keys derived from prod.keys + the game's passphrase. WPA would break the
#     handshake. The wpa_*/rsn_* lines that used to be here were inert with
#     wpa=0 and are gone; a setting that looks active and is not is worse than
#     no setting.
#   * `beacon_int=100` matches the LDN advertisement cadence; the consoles are
#     tolerant, but matching it reduces the chance of missed scans.
#   * `ap_isolate=0` is mandatory: LDN peers talk directly to each other over
#     IP/UDP, so station isolation must be off.
#   * NO `bssid=` line, deliberately. The bridge advertises addr2 = addr3 = the
#     interface's MAC (radio_get_hwaddr), and hostapd uses that same MAC as the
#     BSSID when none is given. A hardcoded bssid here silently made the
#     advertisement come from a different address than the beacon. If you do
#     set one, it must match the interface MAC.

# The physical interface, e.g. wlx54c9ff02cd3b or wlan0. It must be the same
# interface passed to the bridge as --ap-iface.
interface=wlan0
driver=nl80211

# --- network identity -------------------------------------------------------
ssid=ldnbridge
ignore_broadcast_ssid=1

# --- security ---------------------------------------------------------------
# Open system auth, no WPA. LDN does its own crypto above the MAC.
auth_algs=1
wpa=0

# --- radio ------------------------------------------------------------------
hw_mode=g          # or 'a' for 5 GHz
channel=1          # 1, 6 or 11 on 2.4 GHz; 36-48 on 5 GHz
# country_code: set to your domain. LDN uses channels the default domain may
# mark as no-IR; `iw reg set` in setup-ap.sh handles that, so this is mostly
# informational.
country_code=US
ieee80211d=0
ieee80211h=0

# --- timing -----------------------------------------------------------------
beacon_int=100     # LDN advertises every 100 ms
dtim_period=2

# --- behaviour --------------------------------------------------------------
ap_isolate=0       # must be 0: peers must reach each other over IP/UDP
max_num_sta=8      # LDN_NODE_MAX
# Disable power saving; a sleeping station breaks the 100 ms advertisement
# cadence and the 700 ms authentication-response window.
ap_max_inactivity=0

# --- logging ----------------------------------------------------------------
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
