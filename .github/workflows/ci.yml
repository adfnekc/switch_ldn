name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libzstd-dev python3 ripgrep

      - name: Build
        run: make

      - name: Unit tests (no radio hardware needed)
        run: make test

      - name: CLI smoke + removed-option guard
        run: make check

      - name: Interop (real RyuLdn + Room peers against the bridge)
        run: make interop
